<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Financial-Advice-Mobile-Application — AI chat and a dashboard that fits in your pocket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">Financial Advice App</text>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#A7F3D0">AI chat and a dashboard that fits in your pocket.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="190" height="54" rx="27" fill="#FFFFFF"/>
    <text x="155" y="205" font-size="21" font-weight="bold" fill="#065F46" text-anchor="middle">AI Conversation</text>
    <rect x="270" y="170" width="150" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="345" y="205" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dashboard</text>
    <rect x="440" y="170" width="130" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="505" y="205" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Widgets</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#card)"/>
    <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#065F46">“Ask a question, get an answer —</text>
    <text x="730" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#065F46">with a typing effect, like the real thing.”</text>
    <text x="730" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Swipe the drawer for threads.</text>
    <text x="730" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Build your dashboard, widget by widget.</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6EE7B7">React Native + TypeScript  •  Expo  •  Context + useReducer  •  Mobile-first</text>
</svg>
